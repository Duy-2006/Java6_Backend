<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{head :: head}"></head>

<body class="bg-[#f5f5f5] min-h-screen font-display text-[#222]">

<div th:replace="~{menu :: menu}"></div>

<form th:action="@{/checkout}" method="post">

    <!-- ================= HEADER ================= -->
    <header class="sticky top-0 z-50 bg-white border-b">
        <div class="max-w-[1200px] mx-auto flex items-center px-4 py-4">
            <a th:href="@{/cart}" class="size-10 flex items-center justify-center">
                <span class="material-symbols-outlined text-primary">arrow_back_ios_new</span>
            </a>
            <h2 class="flex-1 text-center text-xl font-extrabold uppercase">Thanh toán</h2>
        </div>
    </header>

    <main class="max-w-[1200px] mx-auto px-4 py-8 pb-40">

        <div class="grid grid-cols-1 lg:grid-cols-[1.4fr_1fr] gap-6">

            <!-- ================= THÔNG TIN NHẬN HÀNG ================= -->
            <section class="bg-white rounded-2xl shadow-sm p-6">
                <h3 class="text-xl font-extrabold mb-6">📦 Thông tin nhận hàng</h3>
                <div class="space-y-4">
                    <input type="text" name="customerName" class="input" 
                           placeholder="Họ và tên người nhận" required>

                    <input type="tel" name="customerPhone" class="input" 
                           placeholder="Số điện thoại" required>

                    <textarea name="customerAddress" class="input min-h-[100px]" 
                              placeholder="Địa chỉ giao hàng chi tiết" required></textarea>
                </div>
            </section>

            <!-- ================= TÓM TẮT ĐƠN HÀNG ================= -->
            <section class="bg-white rounded-2xl shadow-sm p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-extrabold">🧾 Đơn hàng</h3>
                    <span class="text-sm text-gray-500 font-bold"
                          th:text="${#lists.size(cartDetails)} + ' sản phẩm'"></span>
                </div>

                <div th:each="item : ${cartDetails}" class="flex gap-4 py-4 border-b last:border-none">
                    <img th:src="@{/uploads/{img}(img=${item.imageUrl})}" 
                         class="w-20 h-28 rounded-xl object-cover"/>
                    <div class="flex-1">
                        <p class="font-bold" th:text="${item.title}"></p>
                        <p class="text-sm text-gray-500 mt-1">
                            Số lượng: <span th:text="${item.quantity}"></span>
                        </p>
                        <p class="font-bold text-primary mt-2"
                           th:text="${#numbers.formatDecimal(item.itemTotal, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                        </p>
                    </div>
                </div>
            </section>

        </div>

        <!-- ================= PHƯƠNG THỨC THANH TOÁN + TÍNH TIỀN (GIỮ PHẦN GIẢM GIÁ) ================= -->
        <div class="grid grid-cols-1 lg:grid-cols-[1fr_420px] gap-6 mt-8">

            <!-- Phương thức thanh toán -->
            <section class="bg-white rounded-2xl shadow-sm p-6">
                <h3 class="text-xl font-extrabold mb-4">💳 Phương thức thanh toán</h3>
                <label class="payment-option">
                    <input type="radio" name="paymentMethod" value="COD" checked>
                    <span>Thanh toán khi nhận hàng (COD)</span>
                </label>
            </section>

            <!-- Tính tiền + Giảm giá -->
            <section class="bg-white rounded-2xl shadow-sm p-6">
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between">
                        <span>Tạm tính</span>
                        <span th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                    </div>

                    <div class="flex justify-between text-red-600">
                        <span>Giảm giá khuyến mãi</span>
                        <span th:text="'-' + ${#numbers.formatDecimal(discount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                    </div>

                    <div class="flex justify-between">
                        <span>Phí vận chuyển</span>
                        <span th:text="${#numbers.formatDecimal(shippingFee, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                    </div>

                    <div class="flex justify-between font-extrabold text-xl pt-4 border-t border-gray-200">
                        <span>Tổng thanh toán</span>
                        <span class="text-primary"
                              th:text="${#numbers.formatDecimal(finalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                        </span>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- Nút xác nhận đặt hàng -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg">
        <div class="max-w-[1200px] mx-auto px-4 py-4">
            <button type="submit"
                    class="w-full bg-primary text-white h-16 rounded-2xl text-xl font-black">
                XÁC NHẬN ĐẶT HÀNG
            </button>
        </div>
    </div>

</form>

<div th:replace="~{footer :: footer}"></div>

<style>
.input {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    outline: none;
}

.input:focus {
    border-color: #1a8a4d;
    box-shadow: 0 0 0 3px rgba(26, 138, 77, 0.15);
}

.payment-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 12px;
}

.payment-option:hover {
    background: #f9fafb;
}
</style>

</body>
</html>
